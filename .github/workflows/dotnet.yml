name: Build Project for Pull Request

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ImageResizr.slnx

      - name: Build
        run: dotnet build ImageResizr.slnx --no-restore

      - name: Test
        run: dotnet test ImageResizr.slnx --no-build --verbosity normal
